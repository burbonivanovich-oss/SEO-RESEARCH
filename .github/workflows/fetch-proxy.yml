name: Fetch Proxy

on:
  push:
    branches:
      - 'claude/**'
      - 'main'
    paths:
      - 'pending-fetches/*.json'
  workflow_dispatch:
    inputs:
      id:
        description: 'Fetch ID'
        required: true
      url:
        description: 'URL'
        required: true

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        working-directory: seo-audit/playwright
        run: |
          npm install
          npx playwright install chromium --with-deps

      - name: Process pending fetches
        working-directory: seo-audit/playwright
        run: |
          set -euo pipefail
          mkdir -p ../../samples

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ID="${{ github.event.inputs.id }}"
            URL="${{ github.event.inputs.url }}"
            echo "{\"id\":\"$ID\",\"url\":\"$URL\"}" > "../../pending-fetches/${ID}.json"
          fi

          PROCESSED=0
          for FILE in ../../pending-fetches/*.json; do
            [ -f "$FILE" ] || continue
            ID=$(python3 -c "import json; print(json.load(open('$FILE'))['id'])")
            URL=$(python3 -c "import json; print(json.load(open('$FILE'))['url'])")
            echo "Fetching: $URL (id=$ID)"
            node proxy-fetch.cjs "$URL" "../../samples/${ID}.html" "../../samples/${ID}.meta.json"
            rm -f "$FILE"
            echo "Saved: samples/${ID}.html"
            PROCESSED=$((PROCESSED+1))
          done
          echo "Total processed: $PROCESSED"

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add samples/ pending-fetches/
          git diff --staged --quiet && { echo "Nothing to commit"; exit 0; }
          FILES=$(git diff --staged --name-only | grep 'samples/' | xargs -I{} basename {} | tr '\n' ' ')
          git commit -m "fetch-proxy: ${FILES}$(date +%H:%M)"
          git push origin ${{ github.ref_name }}
